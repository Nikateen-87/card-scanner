name: Fetch card images
# Downloads official card pictures from Scryfall for the cards listed in img/needed.txt (one "set/number" per line),
# so the Card Binder can store them. Runs whenever img/needed.txt changes, or by hand.
on:
  workflow_dispatch:
  push:
    paths: ['img/needed.txt']
permissions:
  contents: write
concurrency:
  group: fetch-images
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download images from Scryfall
        run: |
          mkdir -p img/cards
          ok=0; miss=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"; [ -z "$line" ] && continue
            set="${line%%/*}"; num="${line#*/}"
            out="img/cards/${set}-${num}.jpg"
            [ -s "$out" ] && continue
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$num")
            if curl -sSfL --retry 3 --retry-delay 2 -A "CardBinderImages/1.0" -H "Accept: image/*" "https://api.scryfall.com/cards/${set}/${enc}?format=image&version=normal" -o "$out"; then ok=$((ok+1)); else rm -f "$out"; miss=$((miss+1)); echo "missing: $line"; fi
            sleep 0.15
          done < img/needed.txt
          echo "downloaded $ok, missing $miss"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/cards
          git diff --cached --quiet || (git commit -m "Card images" && git pull --rebase && git push)
